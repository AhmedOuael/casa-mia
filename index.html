<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Mia</title>
<meta name="description" content="Follow us, visit the store, message us.">
<meta name="theme-color" content="#2A1638">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#2A1638; --field-2:#3E2050;
    --paper:#F3EEE6; --paper-2:#F0DCE6;
    --ink:#3A1E4A; --ink-soft:#7A6285;
    --line:#E0CBD9; --brass:#D6427F;
    --serif:"Playfair Display","Didot","Bodoni 72",Georgia,serif;
    --sans:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{height:100%}
  body{
    min-height:100%;background:var(--field);color:var(--ink);font-family:var(--sans);
    padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0px) + 32px);
    display:flex;justify-content:center;
    background-image:radial-gradient(120% 60% at 50% 0%,var(--field-2),var(--field) 70%);
  }
  .tag{
    position:relative;width:100%;max-width:420px;margin-top:88px;
    background:var(--paper);border-radius:6px 6px 14px 14px;
    padding:64px 26px 28px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
    transform-origin:50% 0;animation:swing 1.6s cubic-bezier(.2,.8,.2,1) both;
  }
  /* punched hole + cord */
  .tag::before{content:"";position:absolute;top:22px;left:50%;width:18px;height:18px;margin-left:-9px;
    border-radius:50%;background:var(--field);box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 0 0 3px var(--paper-2)}
  .tag::after{content:"";position:absolute;bottom:calc(100% - 31px);left:50%;width:2px;height:88px;margin-left:-1px;
    background:linear-gradient(var(--field),var(--brass));}
  @keyframes swing{
    0%{transform:rotate(-3.5deg)} 30%{transform:rotate(2.2deg)} 55%{transform:rotate(-1.2deg)}
    80%{transform:rotate(.5deg)} 100%{transform:rotate(0)}
  }
  header{text-align:center;padding-bottom:22px;border-bottom:1px solid var(--line)}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.4rem,11vw,3.1rem);line-height:1;letter-spacing:.01em}
  .tagline{margin-top:12px;color:var(--ink-soft);font-size:.95rem;line-height:1.5}
  .place{margin-top:6px;color:var(--brass);font-size:.85rem;font-weight:500}
  ul{list-style:none;padding:8px 0 0}
  li+li{border-top:1px solid var(--line)}
  a.row{
    display:flex;align-items:center;gap:16px;padding:16px 4px;min-height:64px;
    color:inherit;text-decoration:none;cursor:pointer;border-radius:6px;
    transition:background-color .18s ease,padding .18s ease;
  }
  a.row:hover{background:var(--paper-2);padding-left:12px;padding-right:12px}
  a.row:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ico{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
  .ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ico svg .f{fill:currentColor;stroke:none}
  .txt{flex:1;min-width:0}
  .name{font-weight:600;font-size:1.02rem}
  .note{color:var(--ink-soft);font-size:.86rem;margin-top:2px;overflow-wrap:anywhere}
  .chev{flex:none;width:18px;height:18px;stroke:var(--ink-soft);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  footer{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:center}
  button.share{
    font:600 .92rem var(--sans);color:var(--ink);background:transparent;cursor:pointer;
    border:1.5px solid var(--ink);border-radius:999px;padding:12px 22px;min-height:44px;
    transition:background-color .18s,color .18s;
  }
  button.share:hover{background:var(--ink);color:var(--paper)}
  dialog{border:0;border-radius:14px;padding:26px;background:var(--paper);color:var(--ink);max-width:340px;width:calc(100% - 32px);text-align:center}
  dialog::backdrop{background:rgba(30,12,46,.72)}
  dialog h2{font-family:var(--serif);font-size:1.5rem;font-weight:600}
  dialog p{color:var(--ink-soft);font-size:.9rem;margin:6px 0 16px}
  #qr{width:100%;max-width:260px;height:auto;border-radius:8px;background:#fff;image-rendering:pixelated}
  .actions{display:flex;gap:10px;justify-content:center;margin-top:18px}
  .actions button{font:600 .9rem var(--sans);padding:11px 18px;min-height:44px;border-radius:999px;cursor:pointer;border:1.5px solid var(--ink)}
  .primary{background:var(--ink);color:var(--paper)}
  .ghost{background:transparent;color:var(--ink)}
  @media (prefers-reduced-motion:reduce){
    .tag{animation:none} a.row,button{transition:none}
  }
</style>
</head>
<body>
<main class="tag">
  <header>
    <h1 id="store-name"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="place" id="place"></p>
  </header>
  <ul id="links"></ul>
  <footer><button class="share" id="open-qr" type="button">Show QR code</button></footer>
</main>

<dialog id="qr-dialog" aria-labelledby="qr-title">
  <h2 id="qr-title">Scan to open</h2>
  <p>Point a phone camera at the code.</p>
  <canvas id="qr" width="260" height="260" role="img" aria-label="QR code for this page"></canvas>
  <div class="actions">
    <button class="primary" id="dl" type="button">Save PNG</button>
    <button class="ghost" id="close" type="button">Close</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ============ EDIT ONLY THIS BLOCK ============
   Remove a line to hide that link. `note` is the small grey text. */
const STORE = {
  name: "Casa Mia",
  tagline: "",
  place: "Open daily  9:00–18:00",            // or "" to hide
  links: [
    { key:"maps",      label:"Visit the store",  note:"Open in Google Maps",   url:"https://www.google.com/maps/place/VQX4%2BG7R+Casamia+shop,+Rue+Cheikh+Larbi+Tebessi,+Annaba/data=!4m2!3m1!1s0x12f007007f601815:0xec35474b662c1e8e!18m1!1e1?utm_source=mstt_1&entry=gps&coh=192189&g_ep=CAESBzI2LjM4LjEYACDXggMqvQEsMTAwODM2NzY0LDk0MjY3NzI3LDk0MjkyMTk1LDk0Mjk5NTMyLDEwMDc5NjQ5OCwxMDA3OTc3NjEsMTAwNzk2NTM1LDk0MjgwNTc2LDk0MjA3Mzk0LDk0MjA3NTA2LDk0MjA4NTA2LDk0MjE4NjUzLDk0MjI5ODM5LDk0Mjc1MTY4LDk0Mjc5NjE5LDEwMDgzNTcwNCwxMDA4MjUwMjUsMTAwODIwMjM3LDEwMDgyMjQ5NCwxMDA4Mjc5NzVCAkRa&skid=8f119541-59b9-4f09-a7b1-58a2f34d92e4&g_st=afm" },
    { key:"instagram", label:"Instagram",        note:"@Casamia shop",           url:"https://www.instagram.com/casa.mia.shop.23" },
    { key:"facebook",  label:"Facebook",         note:"Casamia shop", url:"https://www.facebook.com/people/CASA-MIA-SHOP/61563947782851/?rdid=DvAmvXce2aXs7WHa&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1FYTMj1a9V%2F" },
    { key:"tiktok",    label:"TikTok",           note:"@Casamia shop",           url:"https://www.tiktok.com/@casamia.shop5?_r=1&_t=ZS-9A7BzfXOltN" },
    { key:"whatsapp",  label:"WhatsApp",         note:"0661199926", url:"https://wa.me/2130661199926" },
   
    { key:"phone",     label:"Call us",          note:"0661199926",      url:"tel:+2130661199926" }
  ]
};
/* =============================================== */

const P = { // icon paths (24x24 viewBox)
  maps:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.400-6.500 11-6.500 11z"/><circle cx="12" cy="10" r="2.300"/>',
  instagram:'<rect x="3.500" y="3.500" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.800"/><circle class="f" cx="17.200" cy="6.800" r="1.100"/>',
  facebook:'<path d="M14 8.500h2.500V5H14a3.500 3.500 0 0 0-3.500 3.500V11H8v3.500h2.500V21H14v-6.500h2.400l.6-3.500H14V8.500z"/>',
  tiktok:'<path d="M14 4v10.500a3.500 3.500 0 1 1-3.500-3.500"/><path d="M14 4c.4 2.500 2 4 4.500 4.200"/>',
  whatsapp:'<path d="M4 20l1.200-4A8 8 0 1 1 8.200 19L4 20z"/><path d="M9.200 8.800c.3 2.700 2.300 4.700 5 5l1-1.300-1.800-1-.9.700c-.9-.4-1.500-1-1.900-1.900l.7-.9-1-1.800-1.100 1.200z"/>',
  
  phone:'<path d="M6 4h3l1.500 4-2 1.300a11 11 0 0 0 5.200 5.200l1.300-2 4 1.500v3a2 2 0 0 1-2 2A14 14 0 0 1 4 6a2 2 0 0 1 2-2z"/>'
};
const svg = (d,cls) => `<svg viewBox="0 0 24 24" aria-hidden="true" ${cls?`class="${cls}"`:''}>${d}</svg>`;

document.title = STORE.name ;
document.getElementById("store-name").textContent = STORE.name;
document.getElementById("tagline").textContent = STORE.tagline;
const placeEl = document.getElementById("place");
STORE.place ? placeEl.textContent = STORE.place : placeEl.remove();

const ul = document.getElementById("links");
STORE.links.forEach(l => {
  const li = document.createElement("li");
  const ext = /^https?:/.test(l.url);
  li.innerHTML = `<a class="row" href="${l.url}" ${ext?'target="_blank" rel="noopener noreferrer"':''}>
    <span class="ico">${svg(P[l.key]||P.web)}</span>
    <span class="txt"><span class="name"></span><div class="note"></div></span>
    <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>`;
  li.querySelector(".name").textContent = l.label;
  li.querySelector(".note").textContent = l.note || "";
  ul.appendChild(li);
});

/* QR of THIS page's address, drawn locally (no service, no limits, never expires) */
const dlg = document.getElementById("qr-dialog"), cv = document.getElementById("qr");
function drawQR(){
  if (typeof qrcode === "undefined") { cv.replaceWith(Object.assign(document.createElement("p"),{textContent:"QR library could not load. Check your connection."})); return; }
  const q = qrcode(0,"H"); q.addData(location.href.split("#")[0]); q.make();
  const n = q.getModuleCount(), scale = 10, pad = 3, size = (n+pad*2)*scale;
  cv.width = cv.height = size; const c = cv.getContext("2d");
  c.fillStyle="#fff"; c.fillRect(0,0,size,size); c.fillStyle="#3A1E4A";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++) if(q.isDark(r,k)) c.fillRect((k+pad)*scale,(r+pad)*scale,scale,scale);
}
document.getElementById("open-qr").addEventListener("click",()=>{drawQR();dlg.showModal();});
document.getElementById("close").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close();});
document.getElementById("dl").addEventListener("click",()=>{
  const a=document.createElement("a"); a.download="store-qr.png"; a.href=cv.toDataURL("image/png"); a.click();
});
</script>
</body>
</html>
